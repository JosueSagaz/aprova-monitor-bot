name: Monitor de Protocolos

on:
  schedule:
    # Executa a cada 2 horas (de segunda a sexta-feira)
    - cron: '0 */2 * * 1-5'
  workflow_dispatch: # Permite disparar manualmente para testes

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Instalar Chromium do Playwright
      run: |
        python -m playwright install chromium --with-deps

    - name: Executar verificação de protocolos
      env:
        WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
      run: |
        python check_protocolos.py
